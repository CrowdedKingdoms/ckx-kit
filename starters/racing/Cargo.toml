[package]
name = "racing"
description = "Starter for two types: `race`, a course of gates with a countdown, laps, splits, places and a ghost of the winner; and `ball`, two teams, a ball the hub moves, possession and goals"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ckx-sdk = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
