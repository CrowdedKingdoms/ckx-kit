[package]
name = "npc-mobs"
description = "Starter: an area's mobs and NPCs on a timer, shown to nearby players as realtime actors"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ckx-sdk = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
